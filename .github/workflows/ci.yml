name: CI

on:
  push:
    branches: [preview, main]
  pull_request:
    branches: [preview, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Environment Pre-Flight Sanitation
        run: node scripts/sanitize-env.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit and Security Tests
        run: npm test

      - name: Production Build Verification
        run: npm run build
